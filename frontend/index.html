<!doctype html>
<!-- 这是前端应用的 HTML 入口文件,浏览器最先加载的就是它 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 网页标签页上的小图标 -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- 让移动端也能正常显示(按设备宽度缩放) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浏览器标签页标题 -->
    <title>智能旅行助手</title>
  </head>
  <body>
    <!-- Vue 应用会挂载到这个空 div 上,页面内容全部由 JS 动态生成 -->
    <div id="app"></div>
    <!-- 引入前端入口脚本,所有 JS 逻辑从这里开始执行 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
